apiVersion: apps/v1
kind: Deployment
metadata:
  name: sora-website
  namespace: sora-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sora-website
  template:
    metadata:
      labels:
        app: sora-website
    spec:
      containers:
        - name: sora-website
          image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:1112defc8260d85df81920ca2c5fc795206b0209
          ports:
            - containerPort: 80
