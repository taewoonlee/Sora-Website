apiVersion: apps/v1
kind: Deployment
metadata:
  name: sora-website
  namespace: sora-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sora-website
  template:
    metadata:
      labels:
        app: sora-website
    spec:
      containers:
        - name: sora-website
          image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:c962de2fcb5b0999e8f0df0185c2c41635fee7ae
          ports:
            - containerPort: 80
