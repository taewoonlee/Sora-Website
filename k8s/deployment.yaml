apiVersion: apps/v1
kind: Deployment
metadata:
  name: sora-website
  namespace: sora-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sora-website
  template:
    metadata:
      labels:
        app: sora-website
    spec:
      containers:
        - name: sora-website
          image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:bccf73e325365d445e125b1833643df41b4bb8c7
          ports:
            - containerPort: 80
