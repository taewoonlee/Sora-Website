apiVersion: apps/v1
kind: Deployment
metadata:
  name: sora-website
  namespace: sora-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sora-website
  template:
    metadata:
      labels:
        app: sora-website
    spec:
      containers:
        - name: sora-website
          image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:827eae0ce73887296ad0890a01e1f47b71f7f9d5
          ports:
            - containerPort: 80
