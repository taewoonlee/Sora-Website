apiVersion: apps/v1
kind: Deployment
metadata:
  name: sora-website
  namespace: sora-wbsite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sora-website
  template:
    metadata:
      labels:
        app: sora-website
    spec:
      containers:
        - name: sora-website
          image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:fcd81087699eec8330db25b7a2feb01706fe47ad
          ports:
            - containerPort: 80
