<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Law-Guard Secure Hybrid Security Architecture</title>
  <desc id="desc">Five-step hybrid security architecture flow with module icons and AI-assisted automated response.</desc>
  <rect width="1200" height="330" rx="22" fill="#D7E3F5"/>
  <text x="600" y="34" text-anchor="middle" fill="#536A93" font-size="20" font-family="Segoe UI, Arial" font-weight="700">Law-Guard Secure - Hybrid Security Architecture</text>

  <g font-family="Segoe UI, Arial" font-weight="700" font-size="12" fill="#F7FAFF" text-anchor="middle">
    <rect x="36" y="52" width="208" height="56" rx="14" fill="#4F6FA8"/>
    <text x="152" y="75">Log Collection</text><text x="152" y="95">&amp; Parsing Module</text>

    <rect x="270" y="52" width="208" height="56" rx="14" fill="#4F6FA8"/>
    <text x="386" y="75">Security Event</text><text x="386" y="95">Detection Module</text>

    <rect x="504" y="52" width="208" height="56" rx="14" fill="#4568A9"/>
    <text x="620" y="75">Security Event</text><text x="620" y="95">Response Module</text>

    <rect x="738" y="52" width="208" height="56" rx="14" fill="#4F6FA8"/>
    <text x="854" y="75">Dashboard &amp;</text><text x="854" y="95">Reporting Module</text>

    <rect x="972" y="52" width="192" height="56" rx="14" fill="#4F6FA8"/>
    <text x="1080" y="75">SOC Operations</text><text x="1080" y="95">Module</text>
  </g>

  <!-- module icons -->
  <g stroke="#EAF4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- log/collection icon -->
    <rect x="52" y="66" width="18" height="28" rx="3"/>
    <path d="M56 72H66M56 78H66M56 84H63"/>

    <!-- detection icon -->
    <circle cx="287" cy="81" r="9"/>
    <path d="M293 87L300 94"/>
    <path d="M283 81H291M287 77V85"/>

    <!-- response icon -->
    <path d="M520 70L533 70L533 90L520 90Z"/>
    <path d="M520 70L526.5 64L533 70"/>
    <path d="M523 79L526 82L530 77"/>

    <!-- dashboard icon -->
    <rect x="754" y="68" width="20" height="22" rx="3"/>
    <path d="M759 84V75M764 84V72M769 84V78"/>

    <!-- SOC icon -->
    <circle cx="990" cy="76" r="6"/>
    <path d="M980 92C983 86 997 86 1000 92"/>
  </g>

  <g stroke="#6F9EDD" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 80H264"/><path d="M479 80H498"/><path d="M713 80H732"/><path d="M947 80H966"/>
  </g>
  <g fill="#6F9EDD">
    <polygon points="264,72 280,80 264,88"/>
    <polygon points="498,72 514,80 498,88"/>
    <polygon points="732,72 748,80 732,88"/>
    <polygon points="966,72 982,80 966,88"/>
  </g>

  <rect x="454" y="136" width="292" height="98" rx="20" fill="url(#aiGlow)" stroke="#8AB9F3" stroke-width="2"/>
  <circle cx="600" cy="184" r="38" fill="#2E4F8E" stroke="#A9D1FF" stroke-width="4"/>
  <text x="600" y="194" text-anchor="middle" fill="#DDF1FF" font-size="22" font-family="Segoe UI, Arial" font-weight="800">AI</text>

  <text x="600" y="268" text-anchor="middle" fill="#355884" font-size="9" font-family="Segoe UI, Arial" font-weight="700">AI-assisted Automated Response</text>
  <text x="600" y="286" text-anchor="middle" fill="#3f5f8f" font-size="8" font-family="Segoe UI, Arial" font-weight="700">Policy-based Auto Action</text>

  <path d="M386 108V164H454" stroke="#7EA7D7" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M854 108V164H746" stroke="#7EA7D7" stroke-width="4" stroke-dasharray="8 8"/>

  <defs>
    <linearGradient id="aiGlow" x1="454" y1="136" x2="746" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D2E2F8"/>
      <stop offset="1" stop-color="#C1D8F3"/>
    </linearGradient>
  </defs>
</svg>
